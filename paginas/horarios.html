<!DOCTYPE html>

<header class="sitio-header">

    <a href="../index.html" class="marca">
      <span class="marca-arco"></span>
      <span class="marca-texto">Camino a la Iluminación<small>Software para parroquias</small></span>

    <button class="menu-toggle" id="menu-toggle" aria-label="Abrir menú"><span></span><span></span><span></span></button>

<main>
  <section class="seccion" style="padding-top:56px">
    <div class="envolvente hero-grid" style="align-items:flex-start;">
      <div>
        <div class="encabezado-seccion">
          <p class="eyebrow" id="nombre-parroquia">Parroquia</p>
          <h1>Horarios de misa</h1>
        </div>
        <div class="campo" style="max-width:420px;margin:12px 0 8px;">
          <label for="selector-parroquia">Parroquia</label>
          <select id="selector-parroquia"></select>
        </div>
        <div class="pestanas-dia">
          <button class="pestana-dia activo" data-dia="todos">Toda la semana</button>
          <button class="pestana-dia" data-dia="semana">Lunes a viernes</button>
          <button class="pestana-dia" data-dia="sabado">Sábado</button>
          <button class="pestana-dia" data-dia="domingo">Domingo</button>
        </div>

        <ul class="lista-horarios" id="lista-misas"></ul>
      </div>
      <div class="hero-foto" style="aspect-ratio:4/5;">
        <img src="https://images.pexels.com/photos/9614058/pexels-photo-9614058.jpeg?auto=compress&cs=tinysrgb&w=700" alt="Misa en curso">
      </div>
    </div>
  </section>

  <section class="seccion">
    <div class="envolvente">
      <div class="encabezado-seccion">
        <p class="eyebrow">Esta semana</p>
        <h2>Actividades parroquiales</h2>
      </div>

      <ul class="lista-horarios" id="lista-actividades"></ul>
    </div>
  </section>
</main>

<footer class="sitio-footer">
  <div class="envolvente">
