name: Pruebas

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pruebas:
    name: mvn test (Java 17)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Pruebas automáticas
        run: mvn -B -ntp -f backend/pom.xml clean test

      - name: Empaquetar ROOT.war
        run: mvn -B -ntp -f backend/pom.xml -DskipTests package

      - name: Guardar reportes de pruebas si fallan
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-surefire
          path: backend/target/surefire-reports/
          retention-days: 7
